<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad-prop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Marker Arrow -->
    <marker id="arrow-prop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8"/>
    </marker>

    <!-- Card Glow Filter -->
    <filter id="glow-prop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad-prop)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="1280" y2="90"/>
    <line x1="0" y1="460" x2="1280" y2="460"/>
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 52)">
    <circle cx="10" cy="10" r="4" fill="#38BDF8"/>
    <text x="24" y="16" fill="#38BDF8" font-size="20" font-weight="700" letter-spacing="0.5">
      Prop² — Arquitectura Hexagonal &amp; Screaming Architecture por Dominio
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- 4 ARCHITECTURE CARDS -->
  <!-- ===================================================================== -->

  <!-- CARD 1: Next.js 16 App Router -->
  <g transform="translate(60, 115)" filter="url(#glow-prop)">
    <rect width="235" height="315" rx="10" fill="#111827" stroke="#0284C7" stroke-width="1.8"/>
    <rect width="235" height="42" rx="10" fill="rgba(2, 132, 199, 0.12)"/>
    <line x1="0" y1="42" x2="235" y2="42" stroke="#0284C7" stroke-width="1.2"/>

    <text x="16" y="26" fill="#38BDF8" font-size="14" font-weight="700">Next.js 16 App Router</text>
    <text x="16" y="66" fill="#94A3B8" font-size="11" font-family="monospace">Route Groups &amp; Proxy</text>
    <line x1="16" y1="76" x2="219" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g transform="translate(16, 98)" fill="#CBD5E1" font-size="11.5">
      <circle cx="2" cy="4" r="2" fill="#38BDF8"/>
      <text x="12" y="8" font-weight="500">Rutas Agrupadas (auth/app)</text>
      <text x="12" y="24" fill="#64748B" font-size="10.5">Aislamiento por roles</text>

      <circle cx="2" cy="48" r="2" fill="#38BDF8"/>
      <text x="12" y="52" font-weight="500">Drawer de Búsqueda URL</text>
      <text x="12" y="68" fill="#64748B" font-size="10.5">Filtros sincrónicos searchParams</text>

      <circle cx="2" cy="92" r="2" fill="#38BDF8"/>
      <text x="12" y="96" font-weight="500">Sesiones Optimistas</text>
      <text x="12" y="112" fill="#64748B" font-size="10.5">Auth.js v5 con proxy.ts</text>

      <circle cx="2" cy="136" r="2" fill="#38BDF8"/>
      <text x="12" y="140" font-weight="500">Mobile-First UI</text>
      <text x="12" y="156" fill="#64748B" font-size="10.5">Tailwind CSS + Lucide Icons</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <g transform="translate(295, 255)">
    <line x1="6" y1="0" x2="68" y2="0" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrow-prop)"/>
    <rect x="0" y="-32" width="76" height="20" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="38" y="-18" text-anchor="middle" fill="#38BDF8" font-size="9" font-family="monospace" font-weight="600">Server Action</text>
    <text x="38" y="16" text-anchor="middle" fill="#64748B" font-size="8.5" font-family="monospace">Zod Validated</text>
  </g>

  <!-- CARD 2: Server Actions & Zod -->
  <g transform="translate(372, 115)" filter="url(#glow-prop)">
    <rect width="235" height="315" rx="10" fill="#111827" stroke="#A855F7" stroke-width="1.8"/>
    <rect width="235" height="42" rx="10" fill="rgba(168, 85, 247, 0.12)"/>
    <line x1="0" y1="42" x2="235" y2="42" stroke="#A855F7" stroke-width="1.2"/>

    <text x="16" y="26" fill="#C084FC" font-size="14" font-weight="700">Server Actions &amp; Zod</text>
    <text x="16" y="66" fill="#94A3B8" font-size="11" font-family="monospace">Input Validation &amp; Safety</text>
    <line x1="16" y1="76" x2="219" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g transform="translate(16, 98)" fill="#CBD5E1" font-size="11.5">
      <circle cx="2" cy="4" r="2" fill="#C084FC"/>
      <text x="12" y="8" font-weight="500">Esquemas Zod v4 Estrictos</text>
      <text x="12" y="24" fill="#64748B" font-size="10.5">Tipado estático en compile-time</text>

      <circle cx="2" cy="48" r="2" fill="#C084FC"/>
      <text x="12" y="52" font-weight="500">Firmas Criptográficas</text>
      <text x="12" y="68" fill="#64748B" font-size="10.5">Direct Uploads para Cloudinary</text>

      <circle cx="2" cy="92" r="2" fill="#C084FC"/>
      <text x="12" y="96" font-weight="500">Geocodificación Nominatim</text>
      <text x="12" y="112" fill="#64748B" font-size="10.5">Resolución lat/long automática</text>

      <circle cx="2" cy="136" r="2" fill="#C084FC"/>
      <text x="12" y="140" font-weight="500">Tokens de Verificación</text>
      <text x="12" y="156" fill="#64748B" font-size="10.5">Hashes SHA-256 de un solo uso</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <g transform="translate(607, 255)">
    <line x1="6" y1="0" x2="68" y2="0" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrow-prop)"/>
    <rect x="0" y="-32" width="76" height="20" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="0.8"/>
    <text x="38" y="-18" text-anchor="middle" fill="#34D399" font-size="9" font-family="monospace" font-weight="600">Domain Logic</text>
    <text x="38" y="16" text-anchor="middle" fill="#64748B" font-size="8.5" font-family="monospace">Orchestration</text>
  </g>

  <!-- CARD 3: Domain Services -->
  <g transform="translate(684, 115)" filter="url(#glow-prop)">
    <rect width="235" height="315" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.8"/>
    <rect width="235" height="42" rx="10" fill="rgba(16, 185, 129, 0.12)"/>
    <line x1="0" y1="42" x2="235" y2="42" stroke="#10B981" stroke-width="1.2"/>

    <text x="16" y="26" fill="#34D399" font-size="14" font-weight="700">Servicios de Dominio</text>
    <text x="16" y="66" fill="#94A3B8" font-size="11" font-family="monospace">Pure Logic (*Service.ts)</text>
    <line x1="16" y1="76" x2="219" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g transform="translate(16, 98)" fill="#CBD5E1" font-size="11.5">
      <circle cx="2" cy="4" r="2" fill="#34D399"/>
      <text x="12" y="8" font-weight="500">Aislamiento sin ORM ni HTTP</text>
      <text x="12" y="24" fill="#64748B" font-size="10.5">Reglas de negocio puras</text>

      <circle cx="2" cy="48" r="2" fill="#34D399"/>
      <text x="12" y="52" font-weight="500">Cálculo Preciso de Expensas</text>
      <text x="12" y="68" fill="#64748B" font-size="10.5">Decimal(14,2) sin redondeo</text>

      <circle cx="2" cy="92" r="2" fill="#34D399"/>
      <text x="12" y="96" font-weight="500">Bandeja de Leads CRM</text>
      <text x="12" y="112" fill="#64748B" font-size="10.5">Consultas usuario/invitado</text>

      <circle cx="2" cy="136" r="2" fill="#34D399"/>
      <text x="12" y="140" font-weight="500">Tests Unitarios con Vitest</text>
      <text x="12" y="156" fill="#64748B" font-size="10.5">Pruebas rápidas sin base activa</text>
    </g>
  </g>

  <!-- CONNECTOR 3 -> 4 -->
  <g transform="translate(919, 255)">
    <line x1="6" y1="0" x2="68" y2="0" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow-prop)"/>
    <rect x="0" y="-32" width="76" height="20" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="38" y="-18" text-anchor="middle" fill="#FBBF24" font-size="9" font-family="monospace" font-weight="600">Prisma Driver</text>
    <text x="38" y="16" text-anchor="middle" fill="#64748B" font-size="8.5" font-family="monospace">Postgres Pool</text>
  </g>

  <!-- CARD 4: Prisma 7 & Infrastructure -->
  <g transform="translate(995, 115)" filter="url(#glow-prop)">
    <rect width="235" height="315" rx="10" fill="#111827" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="235" height="42" rx="10" fill="rgba(245, 158, 11, 0.12)"/>
    <line x1="0" y1="42" x2="235" y2="42" stroke="#F59E0B" stroke-width="1.2"/>

    <text x="16" y="26" fill="#FBBF24" font-size="14" font-weight="700">Persistencia &amp; Cloud</text>
    <text x="16" y="66" fill="#94A3B8" font-size="11" font-family="monospace">Neon Postgres + Cloudinary</text>
    <line x1="16" y1="76" x2="219" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g transform="translate(16, 98)" fill="#CBD5E1" font-size="11.5">
      <circle cx="2" cy="4" r="2" fill="#FBBF24"/>
      <text x="12" y="8" font-weight="500">PostgreSQL Full-Text Search</text>
      <text x="12" y="24" fill="#64748B" font-size="10.5">Columna tsvector + índice GIN</text>

      <circle cx="2" cy="48" r="2" fill="#FBBF24"/>
      <text x="12" y="52" font-weight="500">Cloudinary Media CDN</text>
      <text x="12" y="68" fill="#64748B" font-size="10.5">Almacenamiento y thumbnails</text>

      <circle cx="2" cy="92" r="2" fill="#FBBF24"/>
      <text x="12" y="96" font-weight="500">Rate Limiter Upstash Redis</text>
      <text x="12" y="112" fill="#64748B" font-size="10.5">Anti-spam en formularios</text>

      <circle cx="2" cy="136" r="2" fill="#FBBF24"/>
      <text x="12" y="140" font-weight="500">Prisma Client Tipado</text>
      <text x="12" y="156" fill="#64748B" font-size="10.5">Mapeo snake_case a camelCase</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM PANEL: PATRONES DE ARQUITECTURA -->
  <!-- ===================================================================== -->
  <g transform="translate(60, 465)">
    <rect width="1170" height="215" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1.2"/>

    <text x="24" y="34" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="0.5">
      PATRONES Y DESTACADOS DE INGENIERÍA BACKEND:
    </text>

    <g transform="translate(24, 52)" fill="#94A3B8" font-size="12">
      <text x="0" y="22">
        <tspan fill="#38BDF8" font-weight="700">1. Screaming Architecture:</tspan>
        <tspan fill="#CBD5E1"> Código organizado por dominios de negocio (auth, properties, media, crm, catalog) facilitando la navegación y el mantenimiento modular.</tspan>
      </text>

      <text x="0" y="58">
        <tspan fill="#A855F7" font-weight="700">2. Búsqueda Full-Text Nativa con tsvector y GIN:</tspan>
        <tspan fill="#CBD5E1"> Búsquedas instantáneas en español directamente en PostgreSQL sin sobrecosto de infraestructura (Elasticsearch/Algolia) y con consistencia transaccional ACID.</tspan>
      </text>

      <text x="0" y="94">
        <tspan fill="#10B981" font-weight="700">3. Precisión Numérica Decimal(14,2):</tspan>
        <tspan fill="#CBD5E1"> Tipos de datos exactos en base de datos para precios de propiedades y expensas en ARS/USD, eliminando errores de redondeo de coma flotante binaria.</tspan>
      </text>

      <text x="0" y="130">
        <tspan fill="#F59E0B" font-weight="700">4. Desacoplamiento Multimedia &amp; Firmas Directas:</tspan>
        <tspan fill="#CBD5E1"> El navegador sube imágenes directamente a Cloudinary mediante firmas criptográficas generadas por el servidor, sin saturar la memoria ni el CPU de Next.js.</tspan>
      </text>
    </g>
  </g>
</svg>
